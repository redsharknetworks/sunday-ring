<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IOC Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Indicators Dashboard</h1>

  <canvas id="iocChart" width="800" height="400"></canvas>

  <script>
    // Ensure chart_data is always an array
    var chartData = {{ chart_data|default([])|tojson }};

    // Example: Count indicators by type
    var typeCount = {};
    chartData.forEach(item => {
        if(item.type){
            typeCount[item.type] = (typeCount[item.type] || 0) + 1;
        }
    });

    var ctx = document.getElementById('iocChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: Object.keys(typeCount),
            datasets: [{
                label: 'IOC Count by Type',
                data: Object.values(typeCount),
                backgroundColor: 'rgba(255, 99, 132, 0.5)'
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
  </script>
</body>
</html>
