<!DOCTYPE html>
<html>
<head>
    <title>Red Shark Threat Dashboard - Malaysia</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <!-- Auto refresh every 5 min -->
    <meta http-equiv="refresh" content="300">
</head>

<body>
<div class="container mt-4">

    <h1 class="text-danger">Red Shark Threat Intelligence Dashboard</h1>
    <p><strong>Last Updated (UTC+8):</strong> {{ malaysia_time }}</p>

    <hr>

    <!-- TREND -->
    <h3>Risk Trend</h3>
    <img src="data:image/png;base64,{{ trend_image }}" class="img-fluid mb-4"/>

    <!-- HEAT MAP -->
    <h3>Malaysia Geo Heat Map</h3>
    <iframe src="{{ heatmap_file }}" width="100%" height="500" class="mb-4"></iframe>

    <!-- TABLE -->
    <h3>Indicators Table</h3>
    <div class="table-responsive">
        {{ table_html | safe }}
    </div>

    <hr>

    <!-- EXPORT -->
    <h3>Download Reports</h3>
    <ul>
        <li><a href="{{ export_files['csv'] }}" class="btn btn-success btn-sm">CSV</a></li>
        <li><a href="{{ export_files['json'] }}" class="btn btn-primary btn-sm">JSON</a></li>
        <li><a href="{{ export_files['pdf'] }}" class="btn btn-danger btn-sm">PDF</a></li>
    </ul>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
$(document).ready(function () {
    $('table').DataTable({
        "pageLength": 20,
        "lengthChange": false,
        "ordering": true,
        "searching": true,
        "info": true
    });
});
</script>

</body>
</html>
