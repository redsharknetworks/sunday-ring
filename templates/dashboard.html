<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Threat Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #f0f0f0; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #ff6600; }
        .section { margin-bottom: 40px; }
        img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
        iframe { width: 100%; height: 600px; border: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 8px; border: 1px solid #444; text-align: left; }
        th { background-color: #333; color: #ff6600; }
        tr:nth-child(even) { background-color: #2a2a2a; }
    </style>
</head>
<body>
    <h1>Malware Threat Dashboard</h1>

    <div class="section">
        <h2>Trend of Indicators</h2>
        <img src="{{ trend_image }}" alt="Trend Chart">
    </div>

    <div class="section">
        <h2>Geolocation Heat Map</h2>
        <iframe src="{{ url_for('static', filename='../templates/heatmap.html') }}"></iframe>
    </div>

    <div class="section">
        <h2>Latest Indicators</h2>
        <table>
            <thead>
                <tr>
                    <th>Indicator</th>
                    <th>Type</th>
                    <th>Risk Score</th>
                    <th>MITRE</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody>
                {% for row in indicators %}
                <tr>
                    <td>{{ row.indicator }}</td>
                    <td>{{ row.type }}</td>
                    <td>{{ row.risk_score }}</td>
                    <td>{{ row.mitre }}</td>
                    <td>{{ row.created_at }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
