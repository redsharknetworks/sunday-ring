<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Threat Intelligence Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Threat Intelligence Dashboard</h1>
    <canvas id="riskChart" width="800" height="400"></canvas>

    <script>
        const data = {{ data|tojson }};
        
        const labels = data.map(d => d.indicator);
        const scores = data.map(d => d.risk_score);

        const ctx = document.getElementById('riskChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Risk Score',
                    data: scores,
                    backgroundColor: 'rgba(255, 99, 132, 0.6)'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: {
                        display: true,
                        text: 'Top Threat Indicators'
                    }
                }
            }
        });
    </script>
</body>
</html>
