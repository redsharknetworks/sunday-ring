<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Threat Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ff4500;
        }
        .chart-container {
            width: 80%;
            margin: 0 auto;
            text-align: center;
        }
        img {
            max-width: 100%;
            border: 2px solid #ff4500;
            border-radius: 8px;
        }
        .update-time {
            text-align: center;
            margin-top: 10px;
            color: #ccc;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Threat Dashboard</h1>
    
    <div class="chart-container">
        <img id="trendChart" src="/trend.png" alt="Risk Score Trend Chart">
    </div>
    
    <div class="update-time" id="updateTime">
        Last updated: <span id="timeText">Loading...</span>
    </div>

    <script>
        function updateChart() {
            const chart = document.getElementById("trendChart");
            const timeText = document.getElementById("timeText");
            const timestamp = new Date().getTime();
            
            // Force refresh the chart image
            chart.src = `/trend.png?ts=${timestamp}`;
            
            // Update the displayed time
            const now = new Date();
            timeText.innerText = now.toLocaleString();
        }

        // Refresh chart every 30 seconds
        setInterval(updateChart, 30000);

        // Initial load
        updateChart();
    </script>
</body>
</html>
