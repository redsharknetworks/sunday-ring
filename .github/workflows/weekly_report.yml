name: Weekly Threat Report (Render Only)

# Trigger: Every Sunday at 00:00 UTC, also manual dispatch
on:
  schedule:
    - cron: "0 0 * * 0"   # Sunday 00:00 UTC
  workflow_dispatch:

jobs:
  weekly_report:
    runs-on: ubuntu-latest

    steps:
      # --------------------------
      # Checkout repository
      # --------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------
      # Setup Python
      # --------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # --------------------------
      # Install Dependencies
      # --------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # --------------------------
      # Trigger Weekly Report
      # --------------------------
      - name: Trigger Weekly Report Endpoint
        run: |
          echo "Calling Render weekly report endpoint..."
          curl -s -X GET "${{ secrets.RENDER_APP_URL }}/report/weekly?key=${{ secrets.ADMIN_KEY }}" -o weekly_report.json
          cat weekly_report.json

      # --------------------------
      # Download Reports Locally (Optional)
      # --------------------------
      - name: Download Weekly Reports
        run: |
          mkdir -p weekly_reports
          jq -r '.csv' weekly_report.json | xargs -I{} curl -s -o weekly_reports/malaysia_weekly_report.csv "${{ secrets.RENDER_APP_URL }}/{}"
          jq -r '.json' weekly_report.json | xargs -I{} curl -s -o weekly_reports/malaysia_weekly_report.json "${{ secrets.RENDER_APP_URL }}/{}"
          jq -r '.pdf' weekly_report.json | xargs -I{} curl -s -o weekly_reports/malaysia_weekly_report.pdf "${{ secrets.RENDER_APP_URL }}/{}"

      - name: Finish
        run: echo "Weekly reports downloaded successfully. No repo commits."
